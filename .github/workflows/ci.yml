name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

      # The example is a separate module, so ./... above never reaches it. It is
      # the first code a new user runs, and it broke once without CI noticing.
      - name: Build the example module
        working-directory: examples/basic
        run: |
          go build ./...
          go vet ./...

      - name: Check formatting and module tidiness
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "These files need gofmt -s -w:"; gofmt -s -l .; exit 1
          fi
          go mod tidy -diff

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go test -race -tags=smoke -timeout 300s -v ./...
        env:
          VESSELAPI_API_KEY: ${{ secrets.VESSELAPI_API_KEY }}
